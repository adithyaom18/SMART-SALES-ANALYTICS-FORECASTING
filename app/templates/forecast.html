<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sales Forecast</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Shared Dashboard CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container mt-5" style="max-width: 900px;">

    <!-- PAGE TITLE -->
    <h3 class="text-center mb-2 page-title">
        🔮 Sales Forecast
    </h3>

    <p class="text-center text-muted mb-4">
        Machine learning–based prediction of future sales
    </p>

    <!-- FORECAST CONTROLS -->
    <div class="card shadow chart-card p-4 page-spacing">

        <div class="mb-4 text-center">
            <label class="form-label fw-bold">Forecast Horizon</label>
            <select id="monthsSelect" class="form-select w-25 mx-auto">
                <option value="3">Next 3 Months</option>
                <option value="6">Next 6 Months</option>
                <option value="12">Next 12 Months</option>
            </select>
        </div>

        <!-- FORECAST CHART -->
        <canvas id="forecastChart" height="140"></canvas>

    </div>

</div>

<!-- JS -->
<script src="{{ url_for('static', filename='js/forecast.js') }}"></script>

</body>
</html>
