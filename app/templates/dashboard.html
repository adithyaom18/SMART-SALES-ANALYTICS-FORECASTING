<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Smart Sales Analytics Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Dashboard CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container mt-5">

        <!-- PAGE TITLE -->
        <h3 class="text-center mb-2 page-title">
            📊 Sales Analytics & Model Evaluation
        </h3>

        <p class="text-center text-muted mb-4">
            KPI-driven analytics and machine learning based sales forecasting
        </p>

        <!-- KPI CARDS -->
        <div class="row page-spacing" id="kpiCards">
            <!-- Injected dynamically via kpis.js -->
        </div>

        <!-- ROW 1: Monthly Trend + Region -->
        <div class="row page-spacing">
            <div class="col-lg-8 mb-3">
                <div class="card shadow chart-card h-100">
                    <div class="card-body">
                        <h6>Monthly Sales Trend</h6>
                        <canvas id="monthlySalesChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 mb-3">
                <div class="card shadow chart-card h-100">
                    <div class="card-body">
                        <h6>Sales by Region</h6>
                        <canvas id="regionSalesChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- ROW 2: Category -->
        <div class="row page-spacing">
            <div class="col-12">
                <div class="card shadow chart-card">
                    <div class="card-body">
                        <h6>Sales by Category</h6>
                        <canvas id="categorySalesChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- ROW 3: Model Evaluation -->
        <div class="row page-spacing">
            <div class="col-12">
                <div class="card shadow chart-card">
                    <div class="card-body">
                        <h6>Model Evaluation (Actual vs Predicted)</h6>
                        <canvas id="evaluationChart" height="120"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- JS FILES -->
    <script src="{{ url_for('static', filename='js/kpis.js') }}"></script>
    <script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
    <script src="{{ url_for('static', filename='js/evaluation.js') }}"></script>

</body>

</html>
